name: Backend verification
on:
  pull_request:
  push:
    branches: [cloudnest, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDNEST_TEST_POPPLER_BIN: /usr/bin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/check-repository.py
      - run: go mod verify && make check && make test
        working-directory: cloudnest_go
      - run: ./scripts/test-integration.sh
      - run: ./scripts/test-transfer-network.sh
      - run: ./scripts/test-ai-search.sh
      # Compile the opt-in real-server benchmark without running another GiB
      # transfer in every ordinary CI job. Run it locally via make performance.
      - run: go test -tags=integration,performance -run '^$' ./integration
        working-directory: cloudnest_go
      # Keep the real-model test compiled; this runner does not have Ollama.
      # Actual execution is an explicit local make ai-model acceptance step.
      - run: go test -tags=integration,aimodel,aieval -run '^$' ./integration
        working-directory: cloudnest_go
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: make vuln
        working-directory: cloudnest_go
