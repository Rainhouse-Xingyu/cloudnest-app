name: Backend verification
on:
  pull_request:
  push:
    branches: [cloudnest, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-keychain:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: CGO_ENABLED=1 go test -tags=keychainnative -race -count=1 -v ./internal/frpagent -run '^TestDarwinKeychain'
        working-directory: cloudnest_go
      - run: go test -race -count=1 -v ./cmd/agent
        working-directory: cloudnest_go
  agent-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - name: Verify Linux Agent and systemd recovery
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo systemctl start "user@$(id -u).service"
          ./scripts/test-agent-native.sh --systemd
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: python3 scripts/check-repository.py
      - run: go mod verify && make check && make test
        working-directory: cloudnest_go
      - run: ./scripts/test-integration.sh
      - run: ./scripts/test-transfer-network.sh
      # Compile the opt-in real-server benchmark without running another GiB
      # transfer in every ordinary CI job. Run it locally via make performance.
      - run: go test -tags=integration,performance -run '^$' ./integration
        working-directory: cloudnest_go
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: make vuln
        working-directory: cloudnest_go
