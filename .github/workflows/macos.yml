name: macOS client verification
on:
  pull_request:
    paths:
      - 'cloudnest_macos/**'
      - '.github/workflows/macos.yml'
      - 'scripts/test-macos-backend.py'
      - 'cloudnest_go/**'
  push:
    branches: [cloudnest, 'codex/**']
    paths:
      - 'cloudnest_macos/**'
      - '.github/workflows/macos.yml'
      - 'scripts/test-macos-backend.py'
      - 'cloudnest_go/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: macOS client (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    defaults:
      run:
        working-directory: cloudnest_macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sw_vers && xcodebuild -version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cloudnest_go/go.mod
          cache-dependency-path: cloudnest_go/go.sum
      - run: CLOUDNEST_TEST_KEYCHAIN=1 swift test
      - name: Test Swift against the real Go backend
        run: |
          brew install mysql@8.4 redis
          python3 ../scripts/test-macos-backend.py
      - name: Build and verify the release app
        run: |
          xcodebuild -project CloudNest.xcodeproj -scheme CloudNest -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/cloudnest" build
          app="$RUNNER_TEMP/cloudnest/Build/Products/Release/CloudNest.app"
          codesign --verify --deep --strict "$app"
          architectures="$(lipo -archs "$app/Contents/MacOS/CloudNest")"
          echo "Built architectures: $architectures"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
      - name: Package the verified app for native UI testing
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/cloudnest/Build/Products/Release/CloudNest.app" "$RUNNER_TEMP/CloudNest.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CloudNest-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/CloudNest.zip
          retention-days: 7
          if-no-files-found: error
